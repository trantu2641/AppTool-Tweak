name: Build AppTools VI + Ratio (RootHide)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RatioPatch/**"
      - "scripts/**"
      - "localization/**"
      - ".github/workflows/build.yml"
      - "original/**"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew update
          brew install dpkg ldid

      - name: Install RootHide Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          test -d "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk"
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_PACKAGE_SCHEME=roothide" >> "$GITHUB_ENV"

      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f original/AppTools-2.9.0.deb
          test -f RatioPatch/control
          test -f RatioPatch/Makefile
          test -f RatioPatch/AppToolsUI.xm
          test -f RatioPatch/AppRatioRuntime.xm
          test -f RatioPatch/DPIKeyboardFix.xm
          test -f RatioPatch/RatioStore.m
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          dpkg-deb --info original/AppTools-2.9.0.deb

      - name: Build RootHide tweak
        shell: bash
        run: |
          set -euo pipefail
          cd RatioPatch
          rm -rf packages .theos
          make clean
          # Build and stage the tweak only. Theos' dm.pl package step is not
          # needed because scripts/build.sh repacks the final original package
          # with dpkg-deb. Skipping `make package` also avoids the dm.pl failure
          # on the GitHub macOS runner.
          make stage FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          STAGE_DIR="$PWD/.theos/_"
          PATCH_DYLIB="$(find "$STAGE_DIR" -type f -path '*/DynamicLibraries/AppToolsRatioPatch.dylib' -print -quit)"
          PATCH_PLIST="$(find "$STAGE_DIR" -type f -path '*/DynamicLibraries/AppToolsRatioPatch.plist' -print -quit)"
          if [[ -z "$PATCH_DYLIB" || -z "$PATCH_PLIST" ]]; then
            echo "ERROR: Theos staging did not produce the tweak dylib and filter plist." >&2
            find .theos -maxdepth 8 -type f -print >&2 || true
            exit 1
          fi
          otool -l "$PATCH_DYLIB" > "$RUNNER_TEMP/patch-load-commands.txt"
          if grep -q '/var/jb/' "$RUNNER_TEMP/patch-load-commands.txt"; then
            echo "ERROR: rootless /var/jb runpath found in RootHide dylib" >&2
            grep -B2 -A2 '/var/jb/' "$RUNNER_TEMP/patch-load-commands.txt" >&2 || true
            exit 1
          fi
          grep -q '@loader_path/.jbroot' "$RUNNER_TEMP/patch-load-commands.txt"

      - name: Repack original AppTools
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Upload modified DEB
        uses: actions/upload-artifact@v4
        with:
          name: AppTools-2.9.0-VI-Ratio-RootHide
          path: dist/*.deb
          if-no-files-found: error
