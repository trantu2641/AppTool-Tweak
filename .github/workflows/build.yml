name: Build AppTools VI + Screen Ratio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg

      - name: Install Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

      - name: Prepare environment
        run: |
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: AppTools-2.9.0-VI-Ratio
          path: dist/*.deb
